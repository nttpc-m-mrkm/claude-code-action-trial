name: 設計書の自動更新（GitHub Models）

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.java'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
      models: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: 設計書を自動更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # PRの差分を取得
          DIFF=$(gh pr diff $PR_NUMBER)

          # 現在の設計書を読み込み
          DESIGN_DOC=$(cat docs/design.md)

          # GitHub Models API に設計書の更新を依頼
          RESPONSE=$(curl -s -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg diff "$DIFF" \
              --arg doc "$DESIGN_DOC" \
              --arg pr_title "$PR_TITLE" \
              --arg pr_body "$PR_BODY" \
              '{
                "model": "gpt-4o-mini",
                "messages": [
                  {
                    "role": "system",
                    "content": "あなたはソフトウェアの内部設計書を保守するシニアエンジニアです。\nPRの情報（タイトル・説明・コード差分）を読み取り、既存の内部設計書を更新してください。\n\n## 最重要ルール\n\n設計書は「人間が読んで設計を理解するための文書」です。\n単にコードの変更内容を機械的に列挙するのではなく、以下のように自然な日本語の文章で説明を書いてください。\n\n### 悪い例（機械的な列挙）\n> deadlineフィールドを追加した。型はLocalDateTimeである。\n\n### 良い例（設計意図が伝わる文章）\n> タスクに期限（deadline）の概念を導入した。期限は任意項目（null許容）とし、期限なしのタスクも引き続き作成できるようにしている。日時の精度はLocalDateTime（秒単位）を採用し、タイムゾーンはアプリケーション層で統一する方針とした。期限付きタスクの作成には専用メソッド createTaskWithDeadline を用意し、通常のcreateTaskとは分離することで既存の呼び出し元への影響を避けている。\n\n## 更新のルール\n\n1. 設計書の既存のフォーマット・構成・文体を維持すること\n2. コード変更に関係する箇所だけを更新すること（無関係な箇所は一切変えない）\n3. PRのタイトルと説明文から変更の目的・背景を読み取り、設計書に反映すること\n4. 新しいメソッドやクラスが追加された場合は、その役割と既存機能との関係を説明すること\n5. テーブル（データモデル、クラス構成等）は既存の形式に合わせて行を追加・修正すること\n6. API仕様はリクエスト・レスポンスの具体例も含めて更新すること\n7. 制約や注意点（バリデーション、初期値、null許容、遷移ルール等）を明記すること\n8. 変更が不要な場合は、現在の設計書をそのまま返すこと\n\n## 出力形式\n\n- 更新後の設計書全文をMarkdownで出力してください\n- 余計な説明や前置き（「以下が更新後の設計書です」等）は不要です\n- Markdownのコードブロック（```markdown）で囲まないでください"
                  },
                  {
                    "role": "user",
                    "content": ("## PRタイトル\n\n" + $pr_title + "\n\n## PR説明文\n\n" + $pr_body + "\n\n## コード差分\n\n" + $diff + "\n\n## 現在の内部設計書\n\n" + $doc)
                  }
                ],
                "temperature": 0.3
              }'
            )")

          # レスポンスから更新された設計書を抽出
          UPDATED_DOC=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$UPDATED_DOC" ]; then
            echo "設計書の更新なし、またはAPIエラー"
            echo "APIレスポンス: $RESPONSE"
            exit 0
          fi

          # Markdownのコードブロックで囲まれている場合は除去
          UPDATED_DOC=$(echo "$UPDATED_DOC" | sed '/^```markdown$/d' | sed '/^```$/d')

          # 設計書を更新
          echo "$UPDATED_DOC" > docs/design.md

          # 差分があればコミット＆プッシュ
          if git diff --quiet docs/design.md; then
            echo "設計書に変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/design.md
            git commit -m "docs: 設計書を自動更新"
            git push
          fi
