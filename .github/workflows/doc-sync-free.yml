name: 設計書の自動更新（GitHub Models）

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.java'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
      models: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: 設計書を自動更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PRの差分を取得
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }})

          # 現在の設計書を読み込み
          DESIGN_DOC=$(cat docs/design.md)

          # GitHub Models API に設計書の更新を依頼
          RESPONSE=$(curl -s -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg diff "$DIFF" \
              --arg doc "$DESIGN_DOC" \
              '{
                "model": "gpt-4o-mini",
                "messages": [
                  {
                    "role": "system",
                    "content": "あなたはソフトウェアの内部設計書を保守するシニアエンジニアです。\n\nコードの差分を読み取り、既存の内部設計書を更新してください。\n\n## 更新のルール\n\n1. 設計書の既存のフォーマット・構成・文体を維持すること\n2. コード変更に関係する箇所だけを更新すること（無関係な箇所は一切変えない）\n3. 単にフィールドやメソッドの追加を列挙するのではなく、以下の観点で自然な日本語の文章として記述すること：\n   - その変更が何のためのものか（目的・背景）\n   - どのような設計判断がされているか（なぜその型か、なぜその構造か）\n   - 他の機能との関連（既存の処理への影響、呼び出し関係の変化）\n   - 制約や注意点があれば明記する（バリデーション、初期値、遷移ルール等）\n4. テーブル（データモデル、クラス構成等）は既存の形式に合わせて行を追加・修正すること\n5. API仕様はリクエスト・レスポンスの具体例も含めて更新すること\n6. 変更が不要な場合は、現在の設計書をそのまま返すこと\n\n## 出力形式\n\n- 更新後の設計書全文をMarkdownで出力してください\n- 余計な説明や前置き（「以下が更新後の設計書です」等）は不要です\n- Markdownのコードブロック（```markdown）で囲まないでください"
                  },
                  {
                    "role": "user",
                    "content": ("以下のコード差分に基づいて、内部設計書を更新してください。\n\n## PRのコード差分\n\n" + $diff + "\n\n## 現在の内部設計書\n\n" + $doc)
                  }
                ],
                "temperature": 0.1
              }'
            )")

          # レスポンスから更新された設計書を抽出
          UPDATED_DOC=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$UPDATED_DOC" ]; then
            echo "設計書の更新なし、またはAPIエラー"
            echo "APIレスポンス: $RESPONSE"
            exit 0
          fi

          # Markdownのコードブロックで囲まれている場合は除去
          UPDATED_DOC=$(echo "$UPDATED_DOC" | sed '/^```markdown$/d' | sed '/^```$/d')

          # 設計書を更新
          echo "$UPDATED_DOC" > docs/design.md

          # 差分があればコミット＆プッシュ
          if git diff --quiet docs/design.md; then
            echo "設計書に変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/design.md
            git commit -m "docs: 設計書を自動更新"
            git push
          fi
